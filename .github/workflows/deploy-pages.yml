name: Publish Dhaka Metro 3D
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test MRT smooth train positions and UI
        run: |
          node --check data/metro-schedule.js
          node --check app-v2.js
          node scripts/check-metro-quality.mjs
      - name: Build textured Dhaka station-area glTF meshes
        run: node scripts/build-urban-models.mjs
      - name: Generate Farmgate landmark 3D model
        run: node scripts/build-farmgate-landmark.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
