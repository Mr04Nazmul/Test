name: Build Dhaka Metro 3D Assets for Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "dhaka-metro-asset-generator"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test MRT smooth train positions and UI
        run: |
          node --check data/metro-schedule.js
          node --check app-v2.js
          node --check dhaka-soundscape.js
          node --check scripts/build-farmgate-landmark.mjs
          node --check scripts/build-dhaka-traffic.mjs
          node scripts/check-metro-quality.mjs
          node --check data/train-radar.js
          node --check scripts/check-train-radar.mjs
          node scripts/check-train-radar.mjs
          node --check live-rider-p2p.js
          node --check scripts/check-private-gps.mjs
          node scripts/check-private-gps.mjs
      - name: Build six loud locally-hosted iPhone audio tracks and check audible RMS
        run: |
          node --check scripts/build-dhaka-audio.mjs
          node scripts/build-dhaka-audio.mjs
          node scripts/check-dhaka-local-audio.mjs
      - name: Optional genuine Dhaka street recording (CC BY-SA, source attribution)
        continue-on-error: true
        run: |
          node --check scripts/import-dhaka-real-audio.mjs
          node scripts/import-dhaka-real-audio.mjs
      - name: Refresh mapped buildings, roads and trees for busiest 3 station neighborhoods
        # Optional network refresh: static Pages deployments use the committed offline OSM cache.
        # Public Overpass may take minutes or be rate limited; don't block each commit.
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --check scripts/refresh-osm-neighborhoods.mjs
          node scripts/refresh-osm-neighborhoods.mjs
      - name: Collect genuine OSM buildings between stations (small resumable batch)
        # Public OSM endpoints are rate limited; missing segments stay empty.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          node --check scripts/refresh-rail-corridor.mjs
          node scripts/refresh-rail-corridor.mjs --fetch --max=4
      - name: Build along-track OSM 3D gap models
        run: |
          node scripts/refresh-rail-corridor.mjs
          node --check scripts/build-corridor-models.mjs
          node scripts/build-corridor-models.mjs
          node scripts/check-corridor-models.mjs
      - name: Fetch actual Agargaon OpenStreetMap road geometry
        run: |
          node --check scripts/refresh-real-roads.mjs
          node scripts/refresh-real-roads.mjs --station 8
          node scripts/check-actual-roads.mjs
      - name: Build textured Dhaka station-area glTF meshes
        run: node scripts/build-urban-models.mjs
      - name: Validate all 16 surrounding 3D city neighborhoods
        run: |
          node --check scripts/build-urban-models.mjs
          node --check scripts/check-urban-coverage.mjs
          node scripts/check-urban-coverage.mjs
      - name: Generate OSM-aware whole-neighborhood vegetation and fixtures
        run: |
          node --check scripts/build-neighborhood-details.mjs
          node scripts/build-neighborhood-details.mjs
          test -s assets/neighborhood/10.gltf
          test -s assets/neighborhood/13.gltf
      - name: Generate OSM building rooftops and street-facing shopfront details
        run: |
          node --check scripts/build-urban-rooftops.mjs
          node scripts/build-urban-rooftops.mjs
          node scripts/check-urban-rooftops.mjs
      - name: Generate and validate street, ticket-concourse and platform 3D for all stations
        run: |
          node --check scripts/build-station-details.mjs
          node scripts/build-station-details.mjs
          node scripts/check-station-details.mjs
      - name: Generate and check thirteen distinct MRT-6 station structures
        run: |
          node --check scripts/build-station-family.mjs
          node scripts/build-station-family.mjs
          node scripts/check-station-family.mjs
      - name: Create 16 Daily Star aerial-reference MRT6 3D station scenes
        run: |
          node --check scripts/build-photo-stations.mjs
          node scripts/build-photo-stations.mjs
          node scripts/check-photo-stations.mjs
      - name: Generate Farmgate landmark 3D model
        run: node scripts/build-farmgate-landmark.mjs
      - name: Generate Dhaka University station 3D model
        run: |
          node --check scripts/build-dhaka-university-landmark.mjs
          node scripts/build-dhaka-university-landmark.mjs
      - name: Build Agargaon photo-referenced detailed station model
        run: |
          node --check scripts/build-agargaon-station.mjs
          node scripts/build-agargaon-station.mjs
          node scripts/check-agargaon-station.mjs
      - name: Generate all 16 station neighborhood 3D scenes
        run: |
          node --check scripts/build-neighborhood-props.mjs
          node scripts/build-neighborhood-props.mjs
          node scripts/check-neighborhood.mjs
      - name: Verify painted local roads and opt-in Bangladesh ambience
        run: node scripts/check-dhaka-environment.mjs
      - name: Test user-initiated 3D Dhaka audio zones
        run: |
          node --check dhaka-soundscape.js
          node --check scripts/check-dhaka-audio.mjs
          node scripts/check-dhaka-audio.mjs
      - name: Generate Dhaka vehicles
        run: node scripts/build-dhaka-traffic.mjs
      - name: Build and validate Farmgate street micro-models
        run: |
          node --check scripts/build-farmgate-details.mjs
          node scripts/build-farmgate-details.mjs
          node scripts/check-farmgate-details.mjs
      - name: Generate all sixteen OSM-anchored 3D urban facade and rooftop detail models
        run: |
          node --check scripts/build-urban-details.mjs
          node scripts/build-urban-details.mjs
          node scripts/check-urban-details.mjs
      - name: Persist generated glTF assets so branch-based Pages can serve them
        # The repository currently runs the built-in pages-build-deployment in
        # addition to this workflow. Without committed assets that branch build
        # overwrites them, producing 404 for city/station models.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets data/corridor .nojekyll
          if compgen -G 'data/osm-roads/*.json' > /dev/null; then
            git add -f data/osm-roads/*.json
          fi
          if git diff --cached --quiet; then
            echo "No new 3D assets to persist"
          else
            git commit -m "chore: commit generated 3D environment assets for Pages [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "3D assets persisted in main for Pages branch builds"
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Concurrent asset changes; cannot safely rebase"
                exit 1
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Hand off to GitHub Pages branch publisher
        # This repository uses the built-in GitHub Pages deploy-from-branch
        # pipeline. An additional actions/deploy-pages deployment races it and
        # fails HTTP 400 (a Pages deployment is already in progress).
        run: echo "3D assets committed to main; branch-based Pages publishes them."
