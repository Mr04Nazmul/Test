name: Deploy Dhaka Metro 3D to GitHub Pages
# Manual fallback only: deploy-pages.yml owns automatic publishing.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Test MRT smooth train positions and UI
        run: |
          node --check data/metro-schedule.js
          node --check app-v2.js
          node scripts/check-metro-quality.mjs
      - name: Build realistic city-footprint 3D models
        run: node scripts/build-urban-models.mjs
      - name: Generate Farmgate station 3D model
        run: node scripts/build-farmgate-landmark.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
